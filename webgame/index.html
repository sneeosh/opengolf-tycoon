<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>OpenGolf Tycoon</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
				background: #10140f;
				font-family: system-ui, -apple-system, sans-serif;
			}
			#game {
				position: absolute;
				inset: 0;
			}
			#game canvas {
				display: block;
			}
			#ui {
				position: absolute;
				inset: 0;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="game"></div>
		<div id="ui"></div>
		<script type="module" src="/src/main.ts"></script>
